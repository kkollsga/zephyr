name: Auto Release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write
  actions: write

# Serialize rapid VERSION pushes so two runs can't create the same tag
# concurrently. Never cancel an in-progress tagging run.
concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Tag and dispatch release ───────────────────────────────
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid VERSION file contents: '$VERSION' (expected strict X.Y.Z)" >&2
            exit 1
          }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists on origin; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Dispatch release pipeline
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
