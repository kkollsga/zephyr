name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

# Serialize pushes to main so two runs can't act on the same tag
# concurrently. Never cancel an in-progress tagging run.
concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

# A failed release does not consume a version number: the fix is pushed
# with the same VERSION and the release retries. The published GitHub
# release object (created by the final job of release.yml) is the marker
# that a version has shipped; a tag without a release is a failed attempt
# and may safely be moved to the fix commit.
jobs:
  # ─── Tag and dispatch release ───────────────────────────────
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid VERSION file contents: '$VERSION' (expected strict X.Y.Z)" >&2
            exit 1
          }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "release $TAG is already published; nothing to do"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Peel annotated tags to the commit they point at; fall back to
          # the raw ref for lightweight tags.
          TAG_SHA=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$TAG_SHA" ] || TAG_SHA=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$TAG_SHA" ]; then
            echo "tag $TAG does not exist; creating it at $GITHUB_SHA"
            echo "action=tag" >> "$GITHUB_OUTPUT"
          elif [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
            echo "tag $TAG already points at $GITHUB_SHA but no release is published; re-dispatching"
            echo "action=dispatch" >> "$GITHUB_OUTPUT"
          else
            echo "tag $TAG points at $TAG_SHA but no release is published; moving it to $GITHUB_SHA"
            echo "action=retag" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against in-flight release run
        if: steps.state.outputs.action != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BUSY=$(gh run list --workflow=release.yml --json status,headBranch \
            --jq '[.[] | select(.headBranch == env.TAG and .status != "completed")] | length')
          if [ "$BUSY" != "0" ]; then
            echo "a release run for $TAG is still in progress; wait for it to finish (or cancel it), then push again" >&2
            exit 1
          fi

      - name: Create and push tag
        if: steps.state.outputs.action == 'tag' || steps.state.outputs.action == 'retag'
        env:
          ACTION: ${{ steps.state.outputs.action }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$ACTION" = "retag" ]; then
            # Safe to delete: no release was ever published for this tag.
            git push origin ":refs/tags/$TAG"
          fi
          git tag -fa "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Dispatch release pipeline
        if: steps.state.outputs.action != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
