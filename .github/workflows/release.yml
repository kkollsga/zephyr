name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION_FILE: go.mod

jobs:
  # ─── macOS ──────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Validate source and installer
        run: |
          go test ./... -count=1
          ./scripts/install-test.sh
          ./scripts/docs-test.sh

      - name: Determine version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "invalid release ref: $GITHUB_REF (release must be dispatched from a v* tag ref, not a branch)" >&2
            exit 1
          }
          APP_VERSION=${VERSION#v}
          APP_VERSION=${APP_VERSION%%[-+]*}
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal binary
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X main.version=$VERSION -X main.commit=${COMMIT:0:8} -X main.date=$DATE"
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "$LDFLAGS" -o zephyr-arm64 ./cmd/zephyr
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "$LDFLAGS" -o zephyr-amd64 ./cmd/zephyr
          lipo -create zephyr-arm64 zephyr-amd64 -output zephyr
          lipo -info zephyr

      - name: Create .app bundle
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          mkdir -p Zephyr.app/Contents/{MacOS,Resources}
          cp zephyr Zephyr.app/Contents/MacOS/
          cp Info.plist Zephyr.app/Contents/
          plutil -replace CFBundleVersion -string "$APP_VERSION" Zephyr.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" Zephyr.app/Contents/Info.plist
          cp assets/icon.icns Zephyr.app/Contents/Resources/
          codesign --force --sign - Zephyr.app
          plutil -lint Zephyr.app/Contents/Info.plist
          lipo Zephyr.app/Contents/MacOS/zephyr -verify_arch arm64 x86_64
          codesign --verify --deep --strict Zephyr.app
          test "$(plutil -extract CFBundleShortVersionString raw Zephyr.app/Contents/Info.plist)" = "$APP_VERSION"
          Zephyr.app/Contents/MacOS/zephyr --version | grep -F "$VERSION"

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          bash build/macos/create-dmg.sh
          hdiutil verify "Zephyr-${VERSION}-macos.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: "Zephyr-*.dmg"
          if-no-files-found: error

  # ─── Windows ────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Determine version
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
          CGO_ENABLED: "1"
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags "-X main.version=$VERSION -X main.commit=${COMMIT:0:8} -X main.date=$DATE -H windowsgui" \
            -o zephyr.exe ./cmd/zephyr

      - name: Create portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item zephyr.exe staging/
          Copy-Item LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath "Zephyr-$env:VERSION-windows-amd64.zip"

      - name: Build Inno Setup installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          APP_VERSION="${VERSION#v}"
          # Generate ICO from SVG for Inno Setup
          magick -background none assets/icon.svg -define icon:auto-resize=256,128,64,48,32,16 assets/icon.ico
          iscc "//DAPP_VERSION=$APP_VERSION" build/windows/installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            Zephyr-*.zip
            Zephyr-*-setup.exe
          if-no-files-found: error

  # ─── Linux ──────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Determine version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev rpm imagemagick

      - name: Generate PNG from SVG
        run: convert -background none assets/icon.svg -resize 256x256 assets/zephyr-256.png

      - name: Build binary
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags "-X main.version=$VERSION -X main.commit=${COMMIT:0:8} -X main.date=$DATE" \
            -o zephyr ./cmd/zephyr

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          export NFPM_VERSION="${VERSION#v}"
          nfpm package -p deb -f build/linux/nfpm.yaml -t "zephyr_${NFPM_VERSION}_amd64.deb"
          nfpm package -p rpm -f build/linux/nfpm.yaml -t "zephyr-${NFPM_VERSION}-1.x86_64.rpm"

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: bash build/linux/appimage.sh

      - name: Create tarball
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p "zephyr-${VERSION}-linux-amd64"
          cp zephyr LICENSE "zephyr-${VERSION}-linux-amd64/"
          tar czf "zephyr-${VERSION}-linux-amd64.tar.gz" "zephyr-${VERSION}-linux-amd64"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            zephyr_*.deb
            zephyr-*.rpm
            Zephyr-*.AppImage
            zephyr-*-linux-amd64.tar.gz
          if-no-files-found: error

  # ─── Create GitHub Release ──────────────────────────────────
  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            | sed 's#  \./#  #' > SHA256SUMS

      - name: Validate release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION=${TAG#v}
          test -s "dist/Zephyr-${TAG}-macos.dmg"
          test -s "dist/Zephyr-${TAG}-windows-amd64.zip"
          test -s "dist/Zephyr-${APP_VERSION}-setup.exe"
          test -s "dist/Zephyr-${TAG}-x86_64.AppImage"
          test -s "dist/zephyr_${APP_VERSION}_amd64.deb"
          test -s "dist/zephyr-${APP_VERSION}-1.x86_64.rpm"
          test -s "dist/zephyr-${TAG}-linux-amd64.tar.gz"
          grep -F "  Zephyr-${TAG}-macos.dmg" dist/SHA256SUMS

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "Zephyr $TAG" \
            --generate-notes
